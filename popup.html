<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Password Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="extension-container">
    
    <!-- Top Card: Password Display & Actions -->
    <section class="display-card" aria-label="Generated password section">
      <div class="password-wrapper">
        <div id="passwordDisplay" class="password-text" title="Click to copy password"></div>
      </div>
      
      <div class="actions-group">
        <button id="historyBtn" class="icon-btn" title="Password history" aria-label="Password history">
          <svg class="history-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </button>

        <button id="refreshBtn" class="icon-btn" title="Generate new password" aria-label="Generate new password">
          <svg class="refresh-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
        </button>
        
        <button id="copyBtn" class="copy-btn" aria-label="Copy password">
          <svg class="copy-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span id="copyBtnText">Copy password</span>
        </button>
      </div>
    </section>

    <!-- Strength Meter Bar & Label -->
    <div class="strength-section">
      <div class="strength-bar-container">
        <div id="strengthBarFill" class="strength-bar-fill" style="width: 85%;"></div>
      </div>
      <div id="strengthBadge" class="strength-badge">
        <svg class="shield-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 14.5l-3.5-3.5 1.41-1.41L11 12.67l5.59-5.59L18 8.5 11 15.5z"/>
        </svg>
        <span id="strengthLabel">Strong</span>
      </div>
    </div>

    <!-- Pointer Notch pointing to options -->
    <div class="notch-pointer-wrapper">
      <div class="notch-pointer"></div>
    </div>

    <!-- Bottom Container: Options Panel -->
    <section class="options-panel" aria-label="Password generation options">
      <!-- Length row with Presets -->
      <div class="option-row length-row">
        <div class="option-label-group">
          <div class="option-label">
            Password Length <span id="lengthVal" class="length-number">24</span>
          </div>
          <div class="length-presets" aria-label="Quick length presets">
            <button type="button" class="preset-btn" data-len="13" title="13 characters (Fibonacci)">13</button>
            <button type="button" class="preset-btn" data-len="21" title="21 characters (Fibonacci)">21</button>
            <button type="button" class="preset-btn active" data-len="24" title="24 characters (Default)">24</button>
            <button type="button" class="preset-btn" data-len="34" title="34 characters (Fibonacci)">34</button>
            <button type="button" class="preset-btn" data-len="55" title="55 characters (Fibonacci)">55</button>
          </div>
        </div>
        <div class="slider-wrapper">
          <input type="range" id="lengthSlider" min="8" max="64" value="24" step="1" aria-label="Password Length">
        </div>
      </div>

      <!-- Characters Used row -->
      <div class="option-row characters-row">
        <div class="option-label">
          Characters Used
        </div>
        <div class="checkbox-group">
          <label class="custom-checkbox-label">
            <input type="checkbox" id="chkUppercase" class="custom-checkbox" checked>
            <span class="checkbox-box">
              <svg viewBox="0 0 16 16" class="checkmark" fill="currentColor">
                <path d="M13.485 3.929a1 1 0 0 1 .086 1.411l-6.5 7.5a1 1 0 0 1-1.45.045l-3.5-3.5a1 1 0 0 1 1.414-1.414l2.748 2.748 5.791-6.68a1 1 0 0 1 1.411-.086z"/>
              </svg>
            </span>
            <span class="checkbox-text">Uppercase</span>
          </label>

          <label class="custom-checkbox-label">
            <input type="checkbox" id="chkLowercase" class="custom-checkbox" checked>
            <span class="checkbox-box">
              <svg viewBox="0 0 16 16" class="checkmark" fill="currentColor">
                <path d="M13.485 3.929a1 1 0 0 1 .086 1.411l-6.5 7.5a1 1 0 0 1-1.45.045l-3.5-3.5a1 1 0 0 1 1.414-1.414l2.748 2.748 5.791-6.68a1 1 0 0 1 1.411-.086z"/>
              </svg>
            </span>
            <span class="checkbox-text">Lowercase</span>
          </label>

          <label class="custom-checkbox-label">
            <input type="checkbox" id="chkNumbers" class="custom-checkbox" checked>
            <span class="checkbox-box">
              <svg viewBox="0 0 16 16" class="checkmark" fill="currentColor">
                <path d="M13.485 3.929a1 1 0 0 1 .086 1.411l-6.5 7.5a1 1 0 0 1-1.45.045l-3.5-3.5a1 1 0 0 1 1.414-1.414l2.748 2.748 5.791-6.68a1 1 0 0 1 1.411-.086z"/>
              </svg>
            </span>
            <span class="checkbox-text">Numbers</span>
          </label>

          <label class="custom-checkbox-label">
            <input type="checkbox" id="chkSymbols" class="custom-checkbox" checked>
            <span class="checkbox-box">
              <svg viewBox="0 0 16 16" class="checkmark" fill="currentColor">
                <path d="M13.485 3.929a1 1 0 0 1 .086 1.411l-6.5 7.5a1 1 0 0 1-1.45.045l-3.5-3.5a1 1 0 0 1 1.414-1.414l2.748 2.748 5.791-6.68a1 1 0 0 1 1.411-.086z"/>
              </svg>
            </span>
            <span class="checkbox-text">Symbols</span>
          </label>
        </div>
      </div>

      <!-- Avoid Ambiguous Characters row -->
      <div class="option-row ambiguous-row">
        <div class="option-label">
          Readability
        </div>
        <div class="checkbox-group">
          <label class="custom-checkbox-label">
            <input type="checkbox" id="chkExcludeAmbiguous" class="custom-checkbox">
            <span class="checkbox-box">
              <svg viewBox="0 0 16 16" class="checkmark" fill="currentColor">
                <path d="M13.485 3.929a1 1 0 0 1 .086 1.411l-6.5 7.5a1 1 0 0 1-1.45.045l-3.5-3.5a1 1 0 0 1 1.414-1.414l2.748 2.748 5.791-6.68a1 1 0 0 1 1.411-.086z"/>
              </svg>
            </span>
            <span class="checkbox-text">Avoid Ambiguous Characters <span class="ambiguous-hint">(0, O, 1, l, I)</span></span>
          </label>
        </div>
      </div>
    </section>

    <!-- History Drawer Modal -->
    <div id="historyModal" class="history-modal" aria-hidden="true">
      <div class="history-backdrop" id="historyBackdrop"></div>
      <div class="history-card">
        <div class="history-header">
          <div class="history-title">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            Password History
          </div>
          <div class="history-actions">
            <button type="button" id="clearHistoryBtn" class="clear-history-btn" title="Clear all history">Clear</button>
            <button type="button" id="closeHistoryBtn" class="close-history-btn" aria-label="Close history">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
        <div id="historyList" class="history-list">
          <!-- Populated by JavaScript -->
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
      </svg>
      <span id="toastMessage">Password copied to clipboard!</span>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
